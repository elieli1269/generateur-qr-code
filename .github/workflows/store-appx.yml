name: Build Store AppX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/store-appx.yml
      - scripts/**
      - electron/**
      - index.html
      - app.js
      - styles.css

permissions:
  contents: read

jobs:
  store-appx:
    name: Microsoft Store AppX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate unique tile icons
        shell: pwsh
        run: ./scripts/make-appx-tiles.ps1

      - name: Package unsigned AppX for Store signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:store

      - uses: actions/upload-artifact@v4
        with:
          name: qr-folio-store
          if-no-files-found: error
          path: |
            release/*.appx
            release/*.msix
            release/*.appxupload
