name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package exe and installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: qr-folio-windows
          if-no-files-found: error
          path: |
            release/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: QR Folio 1.2.1
          body: |
            Windows installer for QR Folio 1.2.1.

            Store package URL:
            https://github.com/elieli1269/generateur-qr-code/releases/download/v1.2.1/QR-Folio-Setup-1.2.1.exe

            Silent install: QR-Folio-Setup-1.2.1.exe /S
          files: |
            release/QR-Folio-Setup-1.2.1.exe
            release/QR-Folio-1.2.1-portable.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
