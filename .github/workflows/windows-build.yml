name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package exe and installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: qr-folio-windows
          if-no-files-found: error
          path: |
            release/*.exe

  windows-msix:
    name: Microsoft Store MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package unsigned MSIX (Store signs on submission)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:msix

      - uses: actions/upload-artifact@v4
        with:
          name: qr-folio-msix
          if-no-files-found: error
          path: |
            release/*.msix
            release/*.appx
            release/*.msixupload
